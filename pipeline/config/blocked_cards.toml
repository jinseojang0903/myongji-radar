# 사이트에서 급히 내릴 카드 (#65). 내보내기가 이 목록의 카드를 cards.json에서 뺀다.
# (내보내기 연결은 #65의 다음 PR. 그 전에는 여기에 넣어도 카드가 빠지지 않는다)
#
# cards.json을 손으로 고치지 않는다: 카드는 날마다 다시 만들어지고, 매일 공개(--push)는 손으로 고친 카드 커밋을
# 버리고 다시 만든다 (pipeline/README.md "매일 공개"). 카드를 내리려면 여기에 한 칸을 더하는 PR을 올린다.
#
# 칸마다 세 값이 모두 있어야 한다 (모르는 키·빠진 키·같은 id 두 번이면 내보내기가 멈춘다):
#   card_id  사이트 카드 주소 card.html?id=<여기> 의 값 (영문 소문자·숫자·-)
#   reason   왜 내렸는지 한 줄 (100자 이하, 보이는 글자만). 이 파일은 저장소에 올라가므로 개인정보·공지 원문을 쓰지 않는다
#   since    내린 날 (2026-11-06처럼)
#
# 예:
# [[blocked]]
# card_id = "mju-ctl-ctl-792-235972"
# reason = "결과 공지가 대회 카드로 잘못 뽑힘"
# since = 2026-11-06

blocked = []
