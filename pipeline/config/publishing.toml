# #9 잠정 결정. 운영 모델은 이 파일 한 곳에서 바꾼다.
# false면 수집·규칙 분석만 실행한다. 계정 정보는 넣지 않는다.
version = 1
enabled = false
model = "opus"
push = true
# 첫 운영은 새 추출 최대 5건으로 제한한다. 호출별 기본 제한은 300초다.
max_new = 5
# 포스터 이미지도 AI에 넣는다 (#154. 신청 기간·대상이 포스터에만 있는 공지가 많다). 이미지에서 읽은 값은 원문 글자와
# 대조할 수 없어 "확인 필요"로 공개된다. 확인 호출이 이미지 입력을 받지 못하면 공지를 보내기 전에 멈춘다(어제 카드 유지).
# 켜는 첫날은 이미지가 있는 공지를 다시 뽑는다 (max_new씩). 끄려면 이 줄을 지운다
images = true
