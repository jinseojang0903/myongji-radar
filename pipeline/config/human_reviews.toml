# 사람 검수 기록 (#99). 내보내기가 이 목록의 항목을 "검수 완료"로 올린다 (pipeline/exporter/reviews.py).
#
# 검수하는 법 (docs/human-review.md):
#   1. 저장소 루트에서 `npm run review -- <카드 id>` → 공개된 카드의 항목 값·근거·원문 링크와, 붙여 넣을 칸이 나온다
#   2. 원문 공지를 열어 그 항목의 값과 근거가 맞는지 대조한다
#   3. 맞은 항목의 칸만 아래에 붙여 넣고 PR을 올린다 (틀린 항목은 이슈로 알린다)
#
# 카드의 값이나 근거가 검수 때와 조금이라도 달라지면(공지가 바뀌거나 다시 뽑힘) 검수가 풀리고 내보내기 보고에 남는다.
# 그때는 다시 검수해서 그 칸을 새 칸으로 바꾼다. 문의처(contact)는 검수 대상이 아니다.
# 이 파일은 공개 저장소에 올라가므로 검수한 사람 이름·개인정보를 쓰지 않는다 (값은 이미 공개된 카드 값이다).
#
# 칸마다 다섯 값이 모두 있어야 한다:
#   card_id          카드 주소 card.html?id=<여기>
#   field            apply·stages·campus·grades·enrollment·team·deliverables·benefits·mileage·how_to_apply 중 하나
#   value            검수할 때 본 공개 값 (도우미가 만든 JSON 글 그대로)
#   evidence_sha256  검수할 때 본 근거의 지문 (도우미가 만든 값 그대로)
#   since            검수한 날 (2026-11-16처럼)

